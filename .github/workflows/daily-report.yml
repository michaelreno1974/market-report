name: daily-market-report
on:
  schedule:
    - cron: '0 2 * * 1-5'     # 北京 10:00
    - cron: '0 3 * * 1-5'     # 北京 11:00
    - cron: '0 6 * * 1-5'     # 北京 14:00
    - cron: '0 7 * * 1-5'     # 北京 15:00
    - cron: '15 9 * * 1-5'    # 北京 17:15（收盘完整数据）
  workflow_dispatch:         # 支持手动触发
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data
        run: python build_data.py
      - name: Commit report.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git diff --cached --quiet && echo "no change" || (git commit -m "data update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
