<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1f2329" />
<title>每日市场快报</title>
<style>
  :root{--ink:#1f2329;--sub:#5a6472;--line:#e6e9ef;--red:#d4380d;--green:#1e8e3e;--blue:#1d6fe0;--soft:#f0f3f7;--card:#fff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#f2f4f7;color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom);}
  .top{background:#1f2329;color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:9;}
  .top h1{margin:0;font-size:18px;font-weight:600;}
  .top .tm{font-size:11.5px;color:#aeb6c2;margin-top:2px;}
  .body{padding:12px 12px 30px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h2{margin:0 0 8px;font-size:14px;font-weight:600;padding-left:8px;border-left:4px solid var(--blue);}
  .idx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .idx .c{background:var(--soft);border-radius:10px;padding:9px 6px;text-align:center;}
  .idx .k{font-size:11px;color:var(--sub);}
  .idx .v{font-size:17px;font-weight:700;margin-top:1px;}
  .idx .p{font-size:12px;margin-top:1px;}
  .up{color:var(--red);} .down{color:var(--green);} .flat{color:var(--sub);}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .row:last-child{border-bottom:none;}
  .row .nm{width:88px;flex-shrink:0;font-weight:500;}
  .row .bar{flex:1;height:7px;background:var(--soft);border-radius:4px;overflow:hidden;}
  .row .bar i{display:block;height:100%;border-radius:4px;}
  .row .pct{width:58px;text-align:right;font-weight:600;}
  .row .flw{width:66px;text-align:right;font-size:11.5px;color:var(--sub);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;}
  th{background:var(--soft);color:var(--sub);font-weight:600;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:0 7px;font-size:10.5px;color:var(--sub);}
  .tag.water{background:#e6f7ff;color:#0050b3;border-color:#91caff;}
  .foot{font-size:11px;color:var(--sub);text-align:center;padding:16px 20px 8px;line-height:1.7;}
  .loading{text-align:center;color:var(--sub);padding:40px 0;}
  .err{background:#fff1f0;border:1px solid #ffccc7;color:#c0392b;border-radius:10px;padding:14px;margin:12px;font-size:13px;}
  .upd{font-size:11px;color:var(--sub);text-align:center;padding:3px 16px 9px;}
  /* 持仓盯盘 / 复盘 */
  .hold{margin:10px 0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;}
  .hold .hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;}
  .hold .nm{font-size:15px;font-weight:600;}
  .hold .cd{font-size:11px;color:var(--sub);margin-top:1px;}
  .hold .pr{text-align:right;}
  .hold .pv{font-size:20px;font-weight:700;line-height:1.1;}
  .hold .pp{font-size:12px;}
  .hold .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:4px 0 8px;}
  .hold .it{font-size:12px;line-height:1.5;}
  .hold .ik{color:var(--sub);display:inline-block;min-width:40px;}
  .hold .iv{color:var(--ink);}
  .hold .adv{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12.5px;}
  .hold .atag{display:inline-block;font-weight:600;color:#fff;background:var(--blue);border-radius:6px;padding:1px 7px;font-size:11px;margin-right:6px;vertical-align:middle;}
  .hold .atext{font-weight:600;vertical-align:middle;}
  .hold .areason{color:var(--sub);font-size:11.5px;margin-top:3px;}
  /* 每日财经要闻 */
  .nl{display:block;text-decoration:none;color:var(--ink);padding:7px 0;border-bottom:1px dashed var(--line);}
  .nl:last-of-type{border-bottom:none;}
  .nl .nt{display:block;font-size:13.5px;line-height:1.45;}
  .nl .nm{display:block;font-size:11px;color:var(--sub);margin-top:1px;}
  .nl.hl{background:#fffbe6;border:1px solid #ffe58f;border-radius:8px;padding:7px 9px;margin:5px 0;}
  .nl.hl .nt{color:#ad6800;font-weight:600;}
</style>
</head>
<body>
<div class="top"><h1>每日市场快报</h1><div class="tm" id="tm">加载中...</div></div>
<div class="body" id="body"><div class="loading">数据加载中...</div></div>
<div class="upd" id="upd">页面加载中，将自动刷新…</div>
<div class="foot" id="foot">免责声明：本页基于公开行情数据生成，仅供参考，不构成投资建议。市场有风险，投资需谨慎。数据来源：腾讯财经/新浪财经/中金所。属水标签为个人偏好维度。操作建议为指标算法生成，亦不构成买卖依据。</div>
<script>
function n(v,d){v=parseFloat(v);return isFinite(v)?v:(d===undefined?0:d);}
function fmt(v){return (v>=0?'+':'')+v.toFixed(2);}
function cls(v){return v>0.001?'up':(v<-0.001?'down':'flat');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* 安全取嵌套字段（避免数据缺字段时整页报错） */
function gv(obj,key,d){if(!obj||obj[key]==null)return d==null?0:d;var v=parseFloat(obj[key]);return isFinite(v)?v:(d==null?0:d);}

function it(k,v){return '<div class="it"><span class="ik">'+esc(k)+'</span><span class="iv">'+esc(v)+'</span></div>';}
function sign(v){return v>=0?'+':'';}

/* 持仓操作建议：综合趋势/动量/资金/板块给出参考 */
function holdAdvice(price,ma20,e20,j,mi,sz){
  var score=0,rs=[];
  if(price>0&&ma20>0){ if(price>ma20){score+=1;rs.push('站上MA20');} else {score-=1;rs.push('跌破MA20');} }
  if(price>0&&e20>0){ if(price>e20) score+=1; else score-=1; }
  if(j!=null){ if(j<20){score+=1;rs.push('KDJ超卖');} else if(j>80){score-=1;rs.push('KDJ超买');} }
  if(mi>0){score+=1;rs.push('主力净流入');} else if(mi<0){score-=1;rs.push('主力净流出');}
  if(sz>0) score+=0.5; else if(sz<0) score-=0.5;
  var act;
  if(score>=2.5) act='可逢低吸纳，持有为主';
  else if(score<=-2.5) act='减仓避险';
  else if(score>0) act='持有观望';
  else act='观望等待信号';
  if(rs.length===0) rs.push('指标中性');
  return {act:act, reason:rs.slice(0,3).join('、')};
}

function renderHold(s){
  s=s||{};
  var price=n(s.price), pct=n(s.pct), clsP=cls(pct);
  var kdj=s.kdj||{}, boll=s.boll||{}, exp=s.expma||{};
  var price2=n(s.price), ma5=gv(s,'ma5'), ma10=gv(s,'ma10'), ma20=gv(s,'ma20');
  var turn=gv(s,'turnover'), vr=gv(s,'vol_ratio'), mi=gv(s,'main_in_wan');
  var sz=n(s.sector_zdf), sf=n(s.sector_flow);
  // KDJ
  var kdjTxt='—', kdjStat='';
  if(kdj.k!=null){ kdjTxt='K'+n(kdj.k).toFixed(1)+' D'+n(kdj.d).toFixed(1)+' J'+n(kdj.j).toFixed(1);
    var jv=n(kdj.j); kdjStat=jv>80?'超买':(jv<20?'超卖':(jv<0?'严重超卖':'')); }
  // BOLL
  var bollTxt='—', bollPos='';
  if(boll.up!=null){ var bw=boll.width!=null?(' 宽'+n(boll.width).toFixed(1)+'%'):''; bollTxt='上'+n(boll.up).toFixed(2)+' 中'+n(boll.mid).toFixed(2)+' 下'+n(boll.dn).toFixed(2)+bw;
    if(price>n(boll.up)) bollPos='上轨上方(强势)'; else if(price<n(boll.dn)) bollPos='下轨下方(超卖)'; else if(price>n(boll.mid)) bollPos='中轨上方'; else bollPos='中轨下方'; }
  // EXPMA
  var expTxt='—', expPos='';
  if(exp.ema20!=null){ expTxt='20日 '+n(exp.ema20).toFixed(2); expPos=price>n(exp.ema20)?'现价高于EMA20(偏强)':'现价低于EMA20(偏弱)'; }
  var adv=holdAdvice(price,ma20,exp.ema20,kdj.j,mi,sz);
  var pctStr=(pct>=0?'+':'')+pct.toFixed(2)+'%';
  return '<div class="hold">'+
    '<div class="hd"><div><div class="nm">'+esc(s.name)+'</div><div class="cd">'+esc(s.code)+' · '+esc(s.sector)+'</div></div>'+
    '<div class="pr"><div class="pv '+clsP+'">'+price.toFixed(2)+'</div><div class="pp '+clsP+'">'+pctStr+'</div></div></div>'+
    '<div class="grid">'+
      it('均线','MA5 '+fmt2(ma5)+' / MA20 '+fmt2(ma20))+
      it('量价','换手'+turn.toFixed(2)+'% 量比'+vr.toFixed(2)+' 主力'+sign(mi)+mi.toFixed(0)+'万')+
      it('KDJ',kdjTxt+(kdjStat?' '+kdjStat:''))+
      it('BOLL',bollTxt+(bollPos?' '+bollPos:''))+
      it('EXPMA',expTxt+' '+(expPos||''))+
      it('板块',esc(s.sector)+' '+fmt(sz)+'%'+(sf?(' 资金'+sign(sf)+sf.toFixed(2)+'亿'):''))+
    '</div>'+
    '<div class="adv"><span class="atag">操作建议</span><span class="atext">'+esc(adv.act)+'</span><div class="areason">依据：'+esc(adv.reason)+'</div></div>'+
  '</div>';
}
function fmt2(v){return v>0?v.toFixed(2):'—';}

function render(d){
  d=d||{};
  document.getElementById('tm').textContent='更新于 '+(d.date||'')+' · 盘中数据为当时快照';
  var h='';
  if(d.holdings && d.holdings.length){
    h+='<div class="card"><h2>持仓盯盘 · 复盘</h2>'+d.holdings.map(renderHold).join('')+
       '<div style="font-size:11px;color:var(--sub);margin-top:5px;">默认持仓祥源文旅，可在 cloud/build_data.py 的 STOCK_HOLDINGS 中增改。操作建议为指标算法生成，仅供参考。</div></div>';
  }
  // 每日财经要闻（持仓相关高亮 + 市场精选）
  var holdNews=d.hold_news||[], marketNews=d.news||[];
  if(holdNews.length||marketNews.length){
    var nh='<div class="card"><h2>每日财经要闻</h2>';
    if(holdNews.length){
      nh+='<div style="font-size:11px;color:#ad6800;margin-bottom:4px;">持仓相关（'+esc(d.holdings&&d.holdings[0]?d.holdings[0].name:'')+'）</div>';
      nh+=holdNews.map(function(x){
        return '<a class="nl hl" href="'+esc(x.url)+'" target="_blank" rel="noopener"><span class="nt">'+esc(x.title)+'</span><span class="nm">'+esc(x.media||'')+' · '+esc(x.time||'')+(x.src?' · '+esc(x.src):'')+'</span></a>';
      }).join('');
    }
    if(marketNews.length){
      nh+=marketNews.map(function(x){
        return '<a class="nl" href="'+esc(x.url)+'" target="_blank" rel="noopener"><span class="nt">'+esc(x.title)+'</span><span class="nm">'+esc(x.media||'')+' · '+esc(x.time||'')+'</span></a>';
      }).join('');
    }
    nh+='<div style="font-size:10.5px;color:var(--sub);margin-top:6px;">新闻来自公开接口，仅供参考，不构成投资建议。</div></div>';
    h+=nh;
  }
  h+='<div class="card"><h2>大盘</h2><div class="idx">'+((d.index||[]).map(function(i){
    return '<div class="c"><div class="k">'+esc(i.name)+'</div><div class="v '+cls(i.pct)+'">'+n(i.price).toFixed(2)+'</div><div class="p '+cls(i.pct)+'">'+fmt(i.pct)+'%</div></div>';
  }).join('')||'<div class="loading">暂无</div>')+'</div></div>';

  var ind=d.industry||[];
  h+='<div class="card"><h2>行业热点</h2>'+ind.slice(0,6).map(function(b){
    var max=Math.max.apply(null,ind.map(function(x){return Math.abs(x.zdf||0);}))||1;
    var w=Math.max(4,Math.abs(b.zdf||0)/max*100);
    var col=(b.zdf||0)>=0?'#d4380d':'#1e8e3e';
    return '<div class="row"><div class="nm">'+esc(b.name)+'</div><div class="bar"><i style="width:'+w+'%;background:'+col+';"></i></div>'+
      '<div class="pct" style="color:'+col+';">'+fmt(b.zdf||0)+'%</div><div class="flw">'+(b.zljlr>=0?'+':'')+(b.zljlr||0).toFixed(1)+'亿</div></div>';
  }).join('')+'</div>';

  h+='<div class="card"><h2>周边市场</h2><table><tr><th>市场</th><th class="num">最新</th><th class="num">涨跌</th></tr>'+
    Object.keys(d.global||{}).map(function(k){var g=(d.global||{})[k]||[0,0];
      return '<tr><td>'+esc(k)+'</td><td class="num">'+n(g[0]).toFixed(2)+'</td><td class="num '+cls(g[1])+'">'+fmt(n(g[1]))+'%</td></tr>';
    }).join('')+'</table></div>';

  h+='<div class="card"><h2>股指期货 · 中信净空变化</h2><table><tr><th>品种</th><th>前20净</th><th>中信净空</th><th>当日变化</th></tr>'+
    (d.futures||[]).map(function(f){
      return '<tr><td>'+esc(f.prod)+'('+esc(f.main)+')</td><td class="num">'+n(f.net20)+'</td><td class="num">'+n(f.citic_net)+'</td><td class="num '+cls(-n(f.citic_dnet))+'">'+(n(f.citic_dnet)>0?'+':'')+n(f.citic_dnet)+'</td></tr>';
    }).join('')+'</table><div style="font-size:11px;color:var(--sub);margin-top:5px;">负值=减空对冲（偏暖）</div></div>';

  if(d.water&&d.water.length){
    h+='<div class="card"><h2>属水板块</h2>'+d.water.map(function(w){
      return '<div class="row"><div class="nm">'+esc(w.name)+'</div><div class="bar"><i style="width:100%;background:'+(w.zdf>=0?'#d4380d':'#1e8e3e')+';"></i></div>'+
        '<div class="pct '+cls(w.zdf)+'">'+fmt(w.zdf)+'%</div><div class="flw">领涨 '+esc(w.leader)+'</div></div>';
    }).join('')+'</div>';
  }

  h+='<div class="card"><h2>今日推荐</h2>'+((d.picks||[]).map(function(p){
    var tag=(p.src||'').indexOf('资金')>-1?'资金':'热点';
    return '<div class="row"><div class="nm">'+esc(p.name)+'<br><span style="font-size:10.5px;color:var(--sub);">'+esc(p.code)+'</span></div>'+
      '<div style="flex:1;"></div><div class="pct '+cls(p.pct)+'">'+fmt(p.pct)+'%</div>'+
      '<div class="flw"><span class="tag">'+esc(tag)+'</span></div></div>';
  }).join('')||'<div class="loading">暂无</div>')+'<div style="font-size:11px;color:var(--sub);margin-top:5px;">热点板块领涨 + 全市场涨幅榜 + 主力资金榜，剔除 ST 与新股。</div></div>';
  document.getElementById('body').innerHTML=h;
}

function pad(x){return (x<10?'0':'')+x;}
/* 自动刷新：加载时拉一次，之后每5分钟重新拉取最新 report.json（带时间戳破除 CDN 缓存） */
function load(){
  fetch('report.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.index){document.getElementById('body').innerHTML='<div class="err">数据异常：report.json 格式不正确</div>';return;}
    render(d);
    var now=new Date();
    var u=document.getElementById('upd');
    if(u) u.textContent='数据更新于 '+esc(d.date)+' · 页面每5分钟自动刷新（'+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+'）';
  }).catch(function(e){
    var u=document.getElementById('upd');
    if(u) u.textContent='加载失败：'+esc(e.message)+'，将自动重试';
    document.getElementById('body').innerHTML='<div class="err">数据加载失败：'+esc(e.message)+'。请确认 report.json 已随仓库发布。</div>';
  });
}
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
